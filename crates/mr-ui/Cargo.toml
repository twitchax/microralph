[package]
name = "mr-ui"
version = "0.9.0"
edition = "2024"
description = "Local web dashboard for microralph worktree orchestration"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
thaw = { version = "0.5.0-beta" }
icondata_ai = "0.0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# Client-side dependencies (behind hydrate feature).
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "Window", "Location"], optional = true }

# Server-side dependencies (behind ssr feature).
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "sync", "macros", "process"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"], optional = true }
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:serde_yaml",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:web-sys",
]

[package.metadata.leptos]
output-name = "mr-ui"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
site-addr = "127.0.0.1:3939"
reload-port = 3940
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
