[package]
name = "mr-ui"
version = "0.9.0"
edition = "2024"
description = "Local web dashboard for microralph worktree orchestration"
license = "MIT"

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
thaw = { version = "0.5.0-beta" }
tracing = "0.1"

# Server-side dependencies (behind ssr feature).
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"], optional = true }

[features]
default = []
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "leptos/ssr",
]
hydrate = ["leptos/hydrate"]
